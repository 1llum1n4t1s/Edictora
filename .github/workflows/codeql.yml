name: CodeQL Analysis

# Rust 版 (crates/) と page-scripts (TypeScript) を CodeQL で解析する。
# どちらも build-mode: none (ソースを直接読む) で、ビルド手順は持たない。
# Rust の抽出は cargo でワークスペースを読むため、rust-toolchain.toml の toolchain を先に導入する。
# 配布対象が Windows なので、cfg(windows) のコードも解析対象に入るよう Windows ランナーで動かす。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        language: [ rust, javascript-typescript ]
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain を導入 (rust-toolchain.toml)
        if: matrix.language == 'rust'
        shell: pwsh
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install が失敗しました (exit $LASTEXITCODE)" }
          rustup show active-toolchain

      - name: CodeQL を初期化
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: CodeQL 解析を実行
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
