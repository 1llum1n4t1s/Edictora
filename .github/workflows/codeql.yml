name: CodeQL Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: C# CodeQL
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Select SDK compatible with the locked compiler packs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if (Test-Path -LiteralPath 'global.json') { Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $config.ContainsKey('sdk')) { $config['sdk'] = @{} }
          $config['sdk']['version'] = '10.0.403'
          $config['sdk']['rollForward'] = 'disable'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'global.json' -Encoding utf8
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          dotnet-version: 10.0.403
      - name: CodeQL を初期化
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: csharp
          build-mode: manual
      - name: 復元
        run: dotnet restore ExtWeigh.slnx -p:Configuration=Release --locked-mode
      - name: ビルド
        run: dotnet build ExtWeigh.slnx -c Release --no-restore
      - name: CodeQL 解析を実行
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:csharp
