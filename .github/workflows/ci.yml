name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Unit Test
    runs-on: windows-2022
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify R2 transfer fixtures
        shell: pwsh
        run: |
          & (Join-Path $env:GITHUB_WORKSPACE 'tests/R2Transfer/Run.ps1') -WorkRoot (Join-Path $env:RUNNER_TEMP 'r2-transfer-check')
      - name: Select SDK compatible with the locked compiler packs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if (Test-Path -LiteralPath 'global.json') { Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $config.ContainsKey('sdk')) { $config['sdk'] = @{} }
          $config['sdk']['version'] = '11.0.100'
          $config['sdk']['rollForward'] = 'disable'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'global.json' -Encoding utf8
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 11.0.100

      - name: NuGet パッケージをキャッシュ
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props', '**/packages.lock.json') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: 復元
        run: dotnet restore Edictora.slnx -p:Configuration=Release --locked-mode

      - name: ビルド
        run: dotnet build Edictora.slnx -c Release --no-restore

      - name: ユニットテスト
        run: >-
          dotnet test src/Edictora.Tests
          -c Release
          --no-build
          --filter "TestCategory!=Integration"
          --logger "trx;LogFileName=test-results.trx"

      - name: テスト結果をアップロード
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          retention-days: 3
