name: Release

# 署名付き Portable ZIP (Rust 版 CLI の edictora.exe + LICENSE・README・PRIVACY_POLICY) を GitHub Actions で作り、R2 へ配信する。
# - 配信先: Edictora の R2 bucket・公開ドメインは未確定。scripts/release-local.ps1 の $Bucket / $BaseUrl が
#   空のあいだは、配信を伴う実行は release-local.ps1 側で「配布先が未設定」として止まる
#   (ビルド・署名・ZIP 化の確認だけなら skip_upload=true で実行できる)。作り替え前の配信先は削除済みで使わない。
# - ビルド: cargo build --release --locked。toolchain は rust-toolchain.toml に従う (ランナー同梱の rustup で導入)。
#   page-scripts/dist の JS はコミット済みで include_str! で埋め込むため、Bun は要らない。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。
# - 起動: 手動 (workflow_dispatch)。/vava で版を上げて push した後に、main を指定して実行する
#   (Environment "release" のブランチ制限が main と v* だけを許可するため)。
#   誤配信を避けるため push / tag では自動起動しない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す。
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false
      cleanup:
        description: '配信後に直近 2 版より古い版付き ZIP を R2 から削除する (release-local.ps1 -Cleanup)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  release:
    # ci.yml と同じ Windows イメージでビルドする。MSVC のリンカーはイメージ同梱の Visual Studio C++ ツールチェーンを使う。
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain を導入 (rust-toolchain.toml)
        # 引数なしの `rustup toolchain install` は rust-toolchain.toml の channel・profile・components を読む。
        # リリースではキャッシュを使わず、毎回まっさらな target/ から作る (キャッシュ汚染を配布物に持ち込まない)。
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install が失敗しました (exit $LASTEXITCODE)" }
          rustup show active-toolchain
          rustc -vV

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          CLEANUP: ${{ inputs.cleanup }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          if ($env:CLEANUP -eq 'true') { $arguments.Cleanup = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edictora-release-packages
          path: local-release/artifacts/*
          if-no-files-found: warn
          retention-days: 7
