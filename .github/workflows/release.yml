name: Release

# 署名付き Velopack リリース (Edictora.UI.exe + CLI の edictora.exe) を GitHub Actions で作り、R2 へ配信する。
# - 配信先: Edictora の R2 bucket・公開ドメインは未確定。scripts/release-local.ps1 の $Bucket / $BaseUrl が
#   空のあいだは、配信を伴う実行は release-local.ps1 側で「配布先が未設定」として止まる
#   (ビルド・署名の確認だけなら skip_upload=true で実行できる)。作り替え前の配信先は削除済みで使わない。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。
# - 起動: 手動 (workflow_dispatch)。/vava で版を上げて push した後に、main を指定して実行する
#   (Environment "release" のブランチ制限が main と v* だけを許可するため)。
#   誤配信を避けるため push / tag では自動起動しない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す。
on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルドと署名だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false
      cleanup:
        description: '配信後に manifest 外の古い nupkg を R2 から削除する (release-local.ps1 -Cleanup)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  release:
    # ci.yml と同じ Windows イメージでビルドする。Directory.Build.props の PublishAot により UI と CLI は
    # Native AOT で発行されるため、イメージ同梱の Visual Studio C++ ツールチェーンを使う。
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # release-local.ps1 は --locked-mode で restore するため、ci.yml と同じ SDK に固定する。
      - name: Select SDK compatible with the locked compiler packs
        run: |
          $ErrorActionPreference = 'Stop'
          $config = if (Test-Path -LiteralPath 'global.json') { Get-Content -LiteralPath 'global.json' -Raw | ConvertFrom-Json -AsHashtable } else { @{} }
          if (-not $config.ContainsKey('sdk')) { $config['sdk'] = @{} }
          $config['sdk']['version'] = '11.0.100'
          $config['sdk']['rollForward'] = 'disable'
          $config | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath 'global.json' -Encoding utf8
      - name: .NET SDK をセットアップ
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 11.0.100

      - name: dotnet global tool の配置先を PATH へ追加
        # release-local.ps1 は vpk を dotnet global tool として導入し、PATH から呼ぶ。
        run: (Join-Path $env:USERPROFILE '.dotnet\tools') | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          CLEANUP: ${{ inputs.cleanup }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          if ($env:CLEANUP -eq 'true') { $arguments.Cleanup = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edictora-release-packages
          path: local-release/artifacts/*
          if-no-files-found: warn
          retention-days: 7
