name: Release

# 署名付きの Velopack パッケージ (Rust 版 CLI の edictora.exe と自動更新用の edictora-updater.exe、
# LICENSE・README・PRIVACY_POLICY) を GitHub Actions で作り、R2 へ配信する。
# - 配信先: R2 bucket `edictora-updates`、公開ドメイン https://edictora.kagayoi.com
#   (scripts/release-local.ps1 の $Bucket / $BaseUrl)。クライアントは releases.win.json を読んで自動更新する。
# - ビルド: cargo build --release --locked。toolchain は rust-toolchain.toml に従う (ランナー同梱の rustup で導入)。
#   page-scripts/dist の JS はコミット済みで include_str! で埋め込むため、Bun は要らない。
# - パッケージ: Velopack CLI (vpk) 1.2.161 の vpk pack。full nupkg・Setup.exe・Portable.zip・フィードを作る。
# - 署名: Sigilune (https://github.com/1llum1n4t1s/Sigilune) が Certum SimplySign のクラウド鍵で行う。
#   本人の PC や SimplySign Desktop は不要。
# - 起動: main のコミットに付けた軽量タグ v<x.y.z> の push (/vava が版を上げた main へタグを付けて push すると始まる)。
#   手動実行 (workflow_dispatch) は、同じタグを指定した再実行にだけ使う (gh workflow run release.yml --ref v<x.y.z>)。
#   guard ジョブが、タグであること・厳密な版タグの形・軽量タグで同じ commit・既定ブランチの祖先・版ファイルとの一致を確かめる。
#   Environment "release" は tag ポリシー v[0-9]*.[0-9]*.[0-9]* だけを許可する。GitHub Release は作らない。
# - 秘密情報: Environment "release" の Secrets だけを使う
#   (SIGILUNE_EMAIL / SIGILUNE_TOTP_URI / CLOUDFLARE_API_TOKEN)。
# 手順の本体は scripts/release-local.ps1 で、ローカル実行と同じ処理を通す。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'ビルド・パッケージ作成・署名だけ行い、R2 へ配信しない (成果物は Actions に残る)'
        type: boolean
        default: false
      cleanup:
        description: '配信後に直近 2 版より古い版付きファイル (nupkg・Setup・Portable) を R2 から削除する (release-local.ps1 -Cleanup)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じリポジトリのリリースは同時に走らせない (R2 の固定名ファイルを取り合わないように)。
  group: release
  cancel-in-progress: false

jobs:
  # 配信の入口検査。Environment も Secrets も持たない。タグ以外・版が合わないタグ・main の祖先でないタグはここで止める。
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]] || { echo "::error::タグ以外では配信しない: $GITHUB_REF"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::版タグの形ではない: $GITHUB_REF_NAME"; exit 1; }
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          version="${GITHUB_REF_NAME#v}"
          # 軽量タグで、いまもこの commit を指すこと
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME" --jq '.object.type+" "+.object.sha')" == "commit $GITHUB_SHA" ]] \
            || { echo "::error::タグが $GITHUB_SHA を指す軽量タグではない"; exit 1; }
          # 既定ブランチの祖先であること (depth=1 の checkout では判定できないので compare API を使う)
          default="$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)"
          cmp="$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...$default?per_page=1" --jq '.status+" "+(.behind_by|tostring)')"
          [[ "$cmp" == "ahead 0" || "$cmp" == "identical 0" ]] || { echo "::error::$default の祖先ではない ($cmp)"; exit 1; }
          # 版ファイルとの一致
          file="$(gh api "repos/$GITHUB_REPOSITORY/contents/Cargo.toml?ref=$GITHUB_SHA" -H 'Accept: application/vnd.github.raw' | sed -n 's:^version = "\([^"]*\)".*:\1:p' | head -1)"
          [[ "$file" == "$version" ]] || { echo "::error::版ファイルの版 $file とタグの版 $version が違う"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    # ci.yml と同じ Windows イメージでビルドする。MSVC のリンカーはイメージ同梱の Visual Studio C++ ツールチェーンを使う。
    runs-on: windows-2022
    timeout-minutes: 60
    environment: release
    env:
      # vpk 1.2.161 は .NET 9 ランタイム向け。ランナーに無い場合でも新しい版のランタイムで動かす
      # (無いと vpk が起動できず、release-local.ps1 の版確認で止まる。Skilvella と同じ)。
      DOTNET_ROLL_FORWARD: Major
    defaults:
      run:
        shell: pwsh
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain を導入 (rust-toolchain.toml)
        # 引数なしの `rustup toolchain install` は rust-toolchain.toml の channel・profile・components を読む。
        # リリースではキャッシュを使わず、毎回まっさらな target/ から作る (キャッシュ汚染を配布物に持ち込まない)。
        run: |
          rustup toolchain install
          if ($LASTEXITCODE -ne 0) { throw "rustup toolchain install が失敗しました (exit $LASTEXITCODE)" }
          rustup show active-toolchain
          rustc -vV

      - name: Velopack CLI を導入 (vpk 1.2.161)
        # release-local.ps1 が要求する固定版。版を変えるときはスクリプトの $VpkVersion と合わせる。
        run: |
          dotnet tool install --global vpk --version 1.2.161
          if ($LASTEXITCODE -ne 0) { throw "vpk のインストールが失敗しました (exit $LASTEXITCODE)" }
          # 起動できることをここで確かめる (失敗時は vpk 自身のエラーをログに残す)。
          # 色付け用のエスケープシーケンスを取り除いてから版を照合する。
          $help = (vpk --help 2>&1 | Out-String) -replace "`e\[[0-9;]*m", ''
          if ($help -notmatch '\bVelopack CLI 1\.2\.161\b') { Write-Host $help; throw 'vpk 1.2.161 を起動できません' }

      - name: Sigilune を導入
        uses: 1llum1n4t1s/Sigilune@v1

      - name: ビルド・署名・配信
        env:
          SIGILUNE_EMAIL: ${{ secrets.SIGILUNE_EMAIL }}
          SIGILUNE_TOTP_URI: ${{ secrets.SIGILUNE_TOTP_URI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          CLEANUP: ${{ inputs.cleanup }}
        run: |
          $arguments = @{}
          if ($env:SKIP_UPLOAD -eq 'true') { $arguments.SkipUpload = $true }
          if ($env:CLEANUP -eq 'true') { $arguments.Cleanup = $true }
          try {
            & ./scripts/release-local.ps1 @arguments
          } finally {
            # ランナー上の Certum セッションを残さない。
            sigilune logout | Out-Null
          }

      - name: 成果物をアップロード
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: edictora-release-packages
          path: local-release/artifacts/*
          if-no-files-found: warn
          retention-days: 7
