[package]
name = "edictora"
description = "Chrome Web Store の掲載情報を正本ファイルと一括で比較・更新する CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
# bin が 2 つ（edictora と edictora-updater）あるので、素の `cargo run` は edictora を動かす
default-run = "edictora"

[lib]
path = "src/lib.rs"

[[bin]]
name = "edictora"
path = "src/main.rs"

# ログオン時に HKCU の Run から起動される更新用 exe（コンソールなし）。
# Velopack のパッケージに edictora.exe と並べて入れる（install::hooks が Run に登録する）
[[bin]]
name = "edictora-updater"
path = "src/updater_main.rs"

[dependencies]
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[dev-dependencies]
sha2 = "0.11.1"
